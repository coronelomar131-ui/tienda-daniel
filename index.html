<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PROTHE SHOP — Tenis Originales</title>
    <meta name="description" content="Tenis originales, no réplicas. Escoge tu talla, apártalos por WhatsApp y te llegan a donde estés. Envíos a todo México." />

    <!-- Tipografias. Antes la hoja se cargaba con el truco media=print mas un
         onload="this.media='all'" para no bloquear el pintado. Ese onload es un
         manejador EN LINEA, y la Content-Security-Policy lo bloquea en silencio:
         el sitio se quedaria con la letra del sistema sin que nadie se entere.
         Se cambia por preload + hoja normal: el preload arranca la descarga en
         paralelo con el HTML y el preconnect ya tenia la conexion abierta, asi
         que se recupera casi todo lo que daba el truco, sin codigo en linea.
         display=swap sigue haciendo que el texto salga de inmediato.
         Se quitaron el peso 300 y las cursivas de Barlow: no se usaban. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="Prothe Shop" />

    <!-- Vista previa al compartir el link por WhatsApp, Instagram o Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prothe Shop" />
    <meta property="og:title" content="PROTHE SHOP — Tenis Originales" />
    <meta property="og:description" content="Tenis originales, no réplicas. Escoge tu talla y apártalos por WhatsApp. Envíos a todo México." />
    <meta property="og:image" content="https://tienda-daniel-pearl.vercel.app/compartir.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tienda-daniel-pearl.vercel.app/" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PROTHE SHOP — Tenis Originales" />
    <meta name="twitter:description" content="Tenis originales, no réplicas. Escoge tu talla y apártalos por WhatsApp." />
    <meta name="twitter:image" content="https://tienda-daniel-pearl.vercel.app/compartir.png" />
  </head>

  </body>
</html>
