<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PROTHE SHOP — Tenis Originales</title>
    <meta name="description" content="Tenis originales, no réplicas. Escoge tu talla, apártalos por WhatsApp y te llegan a donde estés. Envíos a todo México." />

    <!-- Tipografias: preconnect para abrir la conexion desde el primer momento,
         y la hoja se carga sin bloquear el pintado (media=print y al cargar se
         activa). Asi el texto sale de inmediato con la letra del sistema y se
         cambia sola cuando llega la buena. Se quitaron el peso 300 y las
         cursivas de Barlow: se bajaban y no se usaban en ningun lado. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" />
    <noscript>
      <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Barlow:wght@400;500;600;700&display=swap" />
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="Prothe Shop" />

    <!-- Vista previa al compartir el link por WhatsApp, Instagram o Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prothe Shop" />
    <meta property="og:title" content="PROTHE SHOP — Tenis Originales" />
    <meta property="og:description" content="Tenis originales, no réplicas. Escoge tu talla y apártalos por WhatsApp. Envíos a todo México." />
    <meta property="og:image" content="https://tienda-daniel-pearl.vercel.app/compartir.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tienda-daniel-pearl.vercel.app/" />
    <meta property="og:locale" content="es_MX" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PROTHE SHOP — Tenis Originales" />
    <meta name="twitter:description" content="Tenis originales, no réplicas. Escoge tu talla y apártalos por WhatsApp." />
    <meta name="twitter:image" content="https://tienda-daniel-pearl.vercel.app/compartir.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
